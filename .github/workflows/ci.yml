name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-lint:
    name: Security & Lint Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bandit flake8

      - name: Run Bandit Security Scan
        run: bandit -r jsninja.py -f json -o bandit-report.json || true

      - name: Upload Bandit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Run Flake8 Linter
        run: flake8 jsninja.py --max-line-length 120 --extend-ignore E203,W503

  functional-test:
    name: Functional Validation
    runs-on: ubuntu-latest
    needs: security-and-lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Syntax Check
        run: python -m py_compile jsninja.py

      - name: Run Basic Help Command
        run: python jsninja.py --help
